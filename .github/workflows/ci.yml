name: Skill CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: MCP and skill compatibility
    uses: ./.github/workflows/skill-compatibility.yml
    secrets: inherit

  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install validator dependency
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r .\.github\requirements-ci.txt

      - name: Validate skill package
        shell: pwsh
        run: python .\tests\validate_skill.py

      - name: Test consumer contract validation
        shell: pwsh
        run: python -B .\tests\test_mcp_contract.py

      - name: Test native toolkit fixtures and analysis
        shell: pwsh
        run: python -B -m unittest discover -s tests -p test_toolkit*.py -v

      - name: Test workflow evaluator without credentials
        shell: pwsh
        run: python -B -m unittest discover -s tests -p test_workflow_evaluator.py -v

      - name: Test source snapshots with both PowerShell hosts
        shell: pwsh
        run: |
          ./tests/Test-SourceSnapshots.ps1 -PythonPath (Get-Command python).Source
          $env:PSModulePath="$env:USERPROFILE\Documents\WindowsPowerShell\Modules;$env:ProgramFiles\WindowsPowerShell\Modules;$env:WINDIR\System32\WindowsPowerShell\v1.0\Modules"
          powershell.exe -NoProfile -File ./tests/Test-SourceSnapshots.ps1 -PythonPath (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell source snapshots failed.' }

      - name: Test toolkit controllers with PowerShell 7
        shell: pwsh
        run: .\tests\Test-Toolkit.ps1 -PythonPath (Get-Command python).Source

      - name: Test toolkit controllers with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Toolkit.ps1 -PythonPath (Get-Command python).Source

      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-Skill.ps1

      - name: Test executable metadata with PowerShell 7
        shell: pwsh
        run: .\tests\Test-ExecutableMetadata.ps1

      - name: Test editor selection with PowerShell 7
        shell: pwsh
        run: .\tests\Test-EditorSelection.ps1

      - name: Test bounded health output with PowerShell 7
        shell: pwsh
        run: .\tests\Test-HealthProbe.ps1

      - name: Test project profiles with PowerShell 7
        shell: pwsh
        run: .\tests\Test-ProjectProfiles.ps1

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Skill.ps1

      - name: Test executable metadata with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ExecutableMetadata.ps1

      - name: Test editor selection with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-EditorSelection.ps1

      - name: Test bounded health output with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-HealthProbe.ps1

      - name: Test project profiles with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ProjectProfiles.ps1

  updater:
    name: Release updater validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test release packages and updater with PowerShell 7
        shell: pwsh
        run: .\tests\Test-SkillReleases.ps1
      - name: Test release packages and updater with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-SkillReleases.ps1

  release:
    name: Verified skill release package
    needs: [validate, updater, compatibility]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind source and tag and build twice
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:GITHUB_SHA) { throw 'Release source commit mismatch.' }
          if (git status --porcelain) { throw 'Release checkout is not clean.' }
          $version = (Get-Content .\skills\mql5-coding\version.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + $version }
          & .\scripts\Package-Skill.ps1 -OutputDirectory .\build\release-first -SourceCommit $commit -Tag $tag
          & .\scripts\Package-Skill.ps1 -OutputDirectory .\build\release-second -SourceCommit $commit -Tag $tag
          foreach ($name in @('mql5-coding-windows.zip','mql5-coding-windows.zip.manifest.json')) {
              $first = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path .\build\release-first $name)).Hash
              $second = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path .\build\release-second $name)).Hash
              if ($first -cne $second) { throw 'Release package is not byte reproducible.' }
              "$name SHA-256: $($first.ToLowerInvariant())" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Retain verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mql5-coding-release-${{ github.sha }}
          path: |
            build/release-first/mql5-coding-windows.zip
            build/release-first/mql5-coding-windows.zip.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
