name: Skill CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate skill package
        shell: pwsh
        run: python .\tests\validate_skill.py

      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-Skill.ps1

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Skill.ps1
