name: Skill CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: MCP and skill compatibility
    uses: ./.github/workflows/skill-compatibility.yml
    secrets: inherit

  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install validator dependency
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r .\.github\requirements-ci.txt

      - name: Validate skill package
        shell: pwsh
        run: python .\tests\validate_skill.py

      - name: Test consumer contract validation
        shell: pwsh
        run: python -B .\tests\test_mcp_contract.py

      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-Skill.ps1

      - name: Test project profiles with PowerShell 7
        shell: pwsh
        run: .\tests\Test-ProjectProfiles.ps1

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Skill.ps1

      - name: Test project profiles with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-ProjectProfiles.ps1
